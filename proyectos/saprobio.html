  <!-- EL ICONO DE LA PESTAÑA: la caja del home, sin las agarraderas.
       Va en LAS NUEVE paginas y no solo en el index. Swup navega sin
       recargar y nunca reemplaza el <head>: el que queda es el de la
       pagina por la que entraste al sitio. Si una sola no lo trae, entrar
       por ella deja el sitio entero sin icono hasta que refresques.
       El ?v= es para poder forzar el cambio: el navegador se guarda el
       favicon con mucha mas insistencia que el resto, y sin subir ese
       numero te podes quedar viendo el viejo por dias. -->
  <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg?v=2">

  <!-- GSAP + ScrollTrigger + Lenis, por CDN: el stack sigue sin build tools.

       necesita que ya existan para registrar el plugin. -->
